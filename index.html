<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Strength Checker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>Password Strength Checker</h1>

    <div class="input-wrapper">
      <input type="password" id="passwordInput" placeholder="Enter a password" />
      <button id="togglePassword" type="button" aria-label="Show password">👁️</button>
    </div>

    <div class="strength-bar">
      <div class="strength-fill" id="strengthFill"></div>
    </div>
    <p class="strength-label">Strength: <span id="strengthText">—</span></p>

    <ul class="requirements">
      <li id="length">❌ At least 8 characters</li>
      <li id="uppercase">❌ One uppercase letter</li>
      <li id="lowercase">❌ One lowercase letter</li>
      <li id="number">❌ One number</li>
      <li id="symbol">❌ One special character</li>
    </ul>

    <p id="crackTime" class="crack-time">Estimated crack time: —</p>
    <p id="message" class="message">Enter a password to begin analysis.</p>

    <button id="copyButton" type="button">Copy Password</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
